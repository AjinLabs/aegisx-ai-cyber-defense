[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisx"
version = "1.0.0"
description = "AEGISX Enterprise Agentic AI Cyber Defense, Threat Intelligence & Human-in-the-Loop Operations Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "torch>=2.2.0",
    "pytest>=8.0.0",
    "httpx>=0.27.0"
]

[tool.pyright]
extraPaths = ["."]

[tool.ruff]
line-length = 120
